# Alembic設定ファイル

[alembic]
# マイグレーションスクリプトの場所
script_location = migrations

# マイグレーションファイルのタイムスタンプ形式
file_template = %%(rev)s_%%(slug)s

# DATABASE_URLは環境変数から取得（env.pyで上書き）
sqlalchemy.url = sqlite:///app.db

[post_write_hooks]
# black で自動フォーマット（オプション）
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
