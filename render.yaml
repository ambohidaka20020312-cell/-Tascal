services:
  # ─────────────────────────────────────────
  # Flask API (backend)
  # ─────────────────────────────────────────
  - type: web
    name: tascal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: tascal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://tascal-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://tascal-frontend.onrender.com
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: tascal.support@gmail.com
      - key: MAIL_DEFAULT_SENDER
        value: tascal.support@gmail.com
      # ── Renderダッシュボードの「Environment」タブで手動設定 ──
      # ANTHROPIC_API_KEY   = sk-ant-...
      # STRIPE_SECRET_KEY   = sk_test_... (まずテストキーでOK)
      # STRIPE_WEBHOOK_SECRET = whsec_...
      # STRIPE_PRICE_ID_PRO = price_...
      # MAIL_PASSWORD       = Gmailアプリパスワード16桁

  # ─────────────────────────────────────────
  # React PWA (frontend) — Static Site
  # ─────────────────────────────────────────
  - type: web
    name: tascal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tascal-api.onrender.com/api/v1
      # VITE_STRIPE_PUBLISHABLE_KEY = pk_test_... (Renderダッシュボードで設定)
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─────────────────────────────────────────
# PostgreSQL database
# ─────────────────────────────────────────
databases:
  - name: tascal-db
    databaseName: tascal_prod
    plan: free
