services:
  # ─────────────────────────────────────────
  # Flask API (backend)
  # ─────────────────────────────────────────
  - type: web
    name: tascal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: tascal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://tascal.onrender.com   # ← フロントエンドのURLに変更
      # ── 以下はRenderダッシュボードの「Environment」で手動設定 ──
      # ANTHROPIC_API_KEY      = sk-ant-...
      # STRIPE_SECRET_KEY      = sk_live_...
      # STRIPE_WEBHOOK_SECRET  = whsec_...
      # STRIPE_PRICE_ID_PRO    = price_...
      # MAIL_PASSWORD          = Gmail アプリパスワード（16桁）
      # ALLOWED_ORIGINS        = https://tascal.onrender.com

  # ─────────────────────────────────────────
  # React PWA (frontend) — Static Site
  # ─────────────────────────────────────────
  - type: web
    name: tascal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tascal-api.onrender.com/api/v1  # ← バックエンドのURLに変更
      # VITE_STRIPE_PUBLISHABLE_KEY = pk_live_...
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─────────────────────────────────────────
# PostgreSQL database
# ─────────────────────────────────────────
databases:
  - name: tascal-db
    databaseName: tascal_prod
    plan: free
