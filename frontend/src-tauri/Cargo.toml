[package]
name = "tascal"
version = "0.1.0"
edition = "2021"

[lib]
name = "tascal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-notification = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-window-state = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
